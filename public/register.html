<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | AgriLink Zambia</title>
    <link rel="stylesheet" href="css/styles.css">
     <script src="js/script.js" defer></script>
</head>

<body>

    <header>
        <a href="index.html">
            <img src="media/images/logo.svg" alt="AgriLink Zambia logo">
        </a>

        <form role="search" action="products.html" method="get">
            <label for="site-search" hidden>Search products</label>
            <input type="search" id="site-search" name="q" placeholder="Search products">
        </form>

        <nav aria-label="Account">
            <ul>
                <li><a href="login.html">Login</a></li>
                <li><a href="register.html" aria-current="page">Register</a></li>
            </ul>
        </nav>  
         
    </header>

    <nav aria-label="Main navigation">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="farmers.html">Farmers</a></li>
            <li><a href="buyers.html">Buyers</a></li>
            <li><a href="transport.html">Transport</a></li>
            <li><a href="about.html">About</a></li>
        </ul>
    </nav>

    <main>

        <section aria-labelledby="register-heading">
            <h1 id="register-heading">Create an Account</h1>
            <p>Join AgriLink Zambia as a farmer, buyer or transporter.</p>

            <form action="#" method="post">

                <fieldset>
                    <legend>I am a</legend>
                    <p>
                        <input type="radio" id="role-farmer" name="role" value="farmer" required>
                        <label for="role-farmer">Farmer</label>
                    </p>
                    <p>
                        <input type="radio" id="role-buyer" name="role" value="buyer">
                        <label for="role-buyer">Buyer</label>
                    </p>
                    <p>
                        <input type="radio" id="role-transporter" name="role" value="transporter">
                        <label for="role-transporter">Transporter</label>
                    </p>
                </fieldset>

                <fieldset>
                    <legend>Your details</legend>
                    <p>
                        <label for="full-name">Full name</label>
                        <input type="text" id="full-name" name="name" autocomplete="name" required>
                    </p>
                    <p>
                        <label for="reg-email">Email</label>
                        <input type="email" id="reg-email" name="email" autocomplete="email" required>
                    </p>
                    <p>
                        <label for="reg-phone">Phone number</label>
                        <input type="tel" id="reg-phone" name="phone" autocomplete="tel" required>
                    </p>
                    <p>
                        <label for="reg-location">Town or province</label>
                        <input type="text" id="reg-location" name="location" required>
                    </p>
                </fieldset>

                <fieldset>
                    <legend>Password</legend>
                    <p>
                        <label for="reg-password">Password</label>
                        <input type="password" id="reg-password" name="password" autocomplete="new-password" minlength="8" required>
                    </p>
                    <p>
                        <label for="reg-confirm">Confirm password</label>
                        <input type="password" id="reg-confirm" name="confirm" autocomplete="new-password" minlength="8" required>
                    </p>
                </fieldset>

                <p>
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">I agree to the <a href="#">terms and conditions</a></label>
                </p>

                <button type="submit">Register</button>
            </form>

            <p>Already have an account? <a href="login.html">Login here</a>.</p>
        </section>

    </main>

    <footer>
        <p>AgriLink Zambia</p>
        <p><a href="contact.html">Contact Us</a></p>
        <p><small>&copy; 2026 AgriLink Zambia</small></p>
    </footer>

</body>
</html>
